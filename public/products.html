  <section><h2>Products</h2><div class="grid" id="productGrid"></div></section>
</main>
<footer><span id="year"></span> &nbsp; <a href="index.html">Back to home</a></footer>
<script>
const $=(i)=>document.getElementById(i);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  $("year").textContent="© "+new Date().getFullYear()+" "+d.profile.name;
  d.projects.filter(pr=>pr.kind==="product").forEach(pr=>{
    const c=document.createElement("article");c.className="card";
    c.innerHTML=`${pr.status?`<span class="status">${esc(pr.status)}</span>`:""}<span class="k">${esc(pr.tag)}</span><h3>${esc(pr.title)}</h3><p>${esc(pr.desc)}</p><ul class="hl">${(pr.highlights||[]).map(h=>`<li>${esc(h)}</li>`).join("")}</ul><div class="stack">${pr.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`;
    $("productGrid").append(c);
  });
});
</script>
<script src="chat.js"></script>
